version: 1
status: PRE_REGISTERED_BEFORE_FINAL_REAL_BENCHMARK
score:
  definition: maximum one-sided 95% lower confidence bound across pre-specified endpoints and target-relevant covered lineages
  z_value: 1.96
  observability_fraction_cutoff: 0.05
  note: A target is abstained when none of its pre-declared lineages is covered or detected in either state.
endpoints:
  - study: GSE157857
    stimulus: IFN_I_18h
    axis: IFN-I
    time_hours: 18
    role: primary
  - study: GSE178429_IFN_6h
    stimulus: IFN_II_6h
    axis: IFN-II
    time_hours: 6
    role: primary
  - study: GSE178429_LPS_6h
    stimulus: TLR_6h
    axis: TLR
    time_hours: 6
    role: primary
  - study: GSE140244_24h
